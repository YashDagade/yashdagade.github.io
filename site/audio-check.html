<script>
  // Headless `--dump-dom --virtual-time-budget=N` snapshots the DOM as soon as the virtual-time budget
  // is spent, and virtual time fast-forwards while the page only awaits an offline render (that work
  // happens on the audio thread, invisible to the virtual clock). In HeadlessChrome only, this keep-alive
  // burns a fixed slice of real CPU per virtual timer tick, so a 30 s budget outlasts the renders; it
  // stops as soon as the report is written (window.__done), and the dump then happens right away.
  if (/HeadlessChrome/.test(navigator.userAgent)) {
    let sink = 0;
    (function keep() {
      if (window.__done) return;
      for (let i = 0; i < 4e6; i++) sink += Math.sqrt(i);
      window.__sink = sink;
      setTimeout(keep, 0);
    })();
  }
</script>

      frames.get(f).push(fn);

  function spectrumReport(label, buf, t0, t1) {
    const sp = spectrum(buf, t0, t1), bd = bandsOf(sp, BANDS), oc = octaves(sp);
    log('  ' + pad(label, 10) + ' bands:   ' + bd.map(x => x.band + ' ' + x.pct.toFixed(1) + '%').join('   '));
    log('  ' + pad('', 10) + ' octaves: ' + OCT.map((f, i) => (f >= 1000 ? f / 1000 + 'k' : f) + ' ' + f1(oc[i])).join('  ') + '  (dB re loudest)');
    return { bd, oc };
  }

  try {
    /* 1. calibration: quiet sine should pass at ~unity */
    if (want('core')) {
      const { buf } = await render(2, (E, ctx) => {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 1000;
        g.gain.value = 0.0631; o.connect(g); g.connect(E.master); o.start(0); o.stop(1);
        const o2 = ctx.createOscillator(), g2 = ctx.createGain(); o2.frequency.value = 1000;
        g2.gain.value = 0.5; o2.connect(g2); g2.connect(E.master); o2.start(1); o2.stop(2);
      });
      const a = stats(buf, 0.5, 0.95), b = stats(buf, 1.5, 1.95);
      log('CALIBRATION   1 kHz sine in -24.0 dBFS peak → out ' + f1(a.peak) + ' dBFS   |   in -6.0 → out ' + f1(b.peak) + ' dBFS (glue + limiter)');
      check('unity for quiet input (±1.0 dB)', Math.abs(a.peak + 24) < 1.0, f1(a.peak));
    }

    /* 1b. start-up: a freshly created engine (= the moment of unlock) must not swallow its first sounds.
           Chrome's DynamicsCompressor starts in a heavily-reducing state and releases it over ~0.2 s. */
    if (want('core')) {
      const { buf } = await render(2, (E, ctx) => {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 1000;
        g.gain.value = 0.0631; o.connect(g); g.connect(E.master); o.start(0); o.stop(0.3);
        E.play.click({ when: 0.6, freq: 2500, q: 2 });
        E.play.click({ when: 1.5, freq: 2500, q: 2 });
      });
      const s0 = stats(buf, 0, 0.05), s1 = stats(buf, 0.05, 0.1), s2 = stats(buf, 0.2, 0.28);
      const c0 = stats(buf, 0.59, 0.64), c1 = stats(buf, 1.49, 1.54);
      // the first click of a fresh engine, played right away (a click at 0.02 s in its own render)
      const { buf: b2 } = await render(0.5, (E) => { E.play.click({ when: 0.02, freq: 2500, q: 2 }); });
      const cFirst = stats(b2, 0.015, 0.06);
      log('START-UP      -24 dBFS tone into a fresh engine → 0–50 ms ' + f1(s0.peak) + '   50–100 ms ' + f1(s1.peak) + '   200–280 ms ' + f1(s2.peak) + ' dBFS;   a click at 0.02 s ' + f1(cFirst.peak) + ' vs at 1.5 s ' + f1(c1.peak) + ' dBFS');
      check('start-up: first 50 ms of a fresh engine at unity (±1.5 dB)', Math.abs(s0.peak + 24) <= 1.5 && Math.abs(s1.peak + 24) <= 1.5, f1(s0.peak) + ' / ' + f1(s1.peak));
      check('start-up: a click right after unlock as loud as later (±1.5 dB)', Math.abs(cFirst.peak - c1.peak) <= 1.5, f1(cFirst.peak) + ' vs ' + f1(c1.peak));
    }

    /* 2. groove: first 8-bar pass (micro-sounds → steady beat), 16.3 s */
    if (want('groove')) {
      const T = 8 * BAR + 0.3;
      const { buf } = await render(T, (E) => {
        const g = E.makeGroove(E.master);
        for (let s = 0; s < 128; s++) g.step(s, 0.05 + s * sd);
      });
      const st = stats(buf, 0, T), w = windows(buf, 2, 0, 16);
      const bars = []; for (let b = 0; b < 8; b++) bars.push(stats(buf, 0.05 + b * BAR, 0.05 + (b + 1) * BAR));
      const intro = stats(buf, 0.05, 0.05 + 2 * BAR), beat = stats(buf, 0.05 + 2 * BAR, 0.05 + 8 * BAR);
      results.groove = { st, w, bars, intro, beat };
      log('');
      log('GROOVE pass 1 (8 bars = ' + f1(8 * BAR) + ' s, 118 BPM, D – Bm – G – A; bars 1–2 micro-sounds only, beat from bar 3)');
      log('  LAB ONLY: no scene plays E.makeGroove (only audio-lab.html and this page). The shipped instruments are measured');
      log('  under INSTRUMENTS / HAT VOICE and the shipped beds under SCENE BEDS AS THEY SHIP; the scene-5 music has its own page.');
      log('  peak ' + f1(st.peak) + ' dBFS   RMS ' + f1(st.rms) + ' dBFS   crest ' + f1(st.peak - st.rms) + ' dB   clips(>=0.999) ' + st.clips + '   NaN ' + st.nans + '   DC ' + st.dc.toExponential(1) + '   side/mid ' + st.width.toFixed(3));
      log('  intro (bars 1–2) RMS ' + f1(intro.rms) + '   beat (bars 3–8) RMS ' + f1(beat.rms) + ' dBFS, peak ' + f1(beat.peak));
      log('  RMS per 2 s:  ' + w.map(x => f1(x.rms)).join('  '));
      log('  RMS per bar:  ' + bars.map(x => f1(x.rms)).join('  '));
      log('  peak per bar: ' + bars.map(x => f1(x.peak)).join('  '));
      const whole = spectrumReport('whole', buf, 0, 16);
      const beatS = spectrumReport('beat', buf, 0.05 + 2 * BAR, 16);
      const introS = spectrumReport('intro', buf, 0.05, 0.05 + 2 * BAR);
      results.grooveSpectrum = { whole, beat: beatS, intro: introS };
      noteHF('groove whole', buf, 0, 16, 'groove');
      noteHF('groove intro', buf, 0.05, 0.05 + 2 * BAR, 'groove');
      noteHF('groove beat', buf, 0.05 + 2 * BAR, 16, 'groove');
      // resonance scan: 1/3-octave levels 1–8 kHz of the beat section; flag any band that stands
      // more than 3 dB above the average of its two neighbours (a whistle or ringing peak).
      // Round 4: averaged with a second render of the same 8 bars. The groove's random click pitches and glitch
      // segments swing a single render's 2.5 kHz band: 0 … 3.0 dB "bumps" over 15 renders of the round-4 engine
      // (0 … 1.2 over 9 of round 3); averaged over 5 renders both engines read 0.1–0.4 dB at 2.5 kHz
      {
        const { buf: buf2 } = await render(T, (E) => {
          const g = E.makeGroove(E.master);
          for (let s = 0; s < 128; s++) g.step(s, 0.05 + s * sd);
        });
        const sp = spectrum(buf, 0.05 + 2 * BAR, 16), sp2 = spectrum(buf2, 0.05 + 2 * BAR, 16);
        for (let k = 0; k < sp.P.length; k++) sp.P[k] += sp2.P[k];
        sp.frames += sp2.frames;
        const TO = [1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000];
        const lv = TO.map(fc => bandDb(sp, fc / Math.pow(2, 1 / 6), fc * Math.pow(2, 1 / 6)));
        const spikes = [];
        for (let q = 1; q < TO.length - 1; q++) spikes.push({ f: TO[q], d: lv[q] - (lv[q - 1] + lv[q + 1]) / 2 });
        const in25 = spikes.filter(x => x.f >= 2000 && x.f <= 5000);
        const worst = in25.reduce((m, x) => (x.d > m.d ? x : m), { f: 0, d: -99 });
        results.resonance = { TO, lv, spikes, worst };
        log('  resonance scan (beat, 2 renders, 1/3-oct dBFS): ' + TO.map((f, q) => (f >= 1000 ? f / 1000 + 'k' : f) + ' ' + f1(lv[q])).join('  '));
        log('  band − avg(neighbours), 2–5 kHz: ' + in25.map(x => (x.f / 1000) + 'k ' + (x.d >= 0 ? '+' : '') + f1(x.d)).join('  ') + '   (worst ' + f1(worst.d) + ' dB @ ' + worst.f + ' Hz)');
        check('groove (lab): no resonance 2–5 kHz (1/3-oct band − neighbours < 3 dB)', worst.d < 3, f1(worst.d) + ' dB @ ' + worst.f);
        // the bump scan cannot see a steady rise: also require the top not to climb (6.3 kHz ≤ 3.15 kHz)
        const tilt = lv[TO.indexOf(6300)] - lv[TO.indexOf(3150)];
        results.grooveTilt = tilt;
        log('  tilt: 1/3-oct 6.3 kHz − 3.15 kHz = ' + (tilt >= 0 ? '+' : '') + f1(tilt) + ' dB');
        // LAB groove (no scene plays it): random ghosts / hat corners swing this ±0.5 dB run to run; round 2 was
        // +5.5 dB. The shipped scene-5 score is held to ≤ 0 dB in its full-kit sections on build-score-check.html.
        check('groove (lab): top rises ≤ 2 dB (1/3-oct 6.3 − 3.15 kHz; round 2 +5.5)', tilt <= 2.05, (tilt >= 0 ? '+' : '') + f1(tilt) + ' dB');
      }
      const bd = beatS.bd, oc = beatS.oc;
      const pres = bd[4].pct + bd[5].pct;
      const spike = oc[7] - (oc[6] + oc[8]) / 2; // 4k octave vs neighbours
      check('groove: no clipping', st.clips === 0, st.clips);
      check('groove: no NaN/Inf', st.nans === 0, st.nans);
      check('groove: peak in [-6, -1] dBFS', st.peak >= -6 && st.peak <= -1, f1(st.peak));
      check('groove: beat RMS in [-18, -13] dBFS', beat.rms >= -18 && beat.rms <= -13, f1(beat.rms));
      check('groove: DC < 1e-3', st.dc < 1e-3, st.dc.toExponential(1));
      check('groove: sub <40 Hz < 8% energy', bd[0].pct < 8, bd[0].pct.toFixed(1) + '%');
      // round 2 is intentionally darker (round 1 measured 1.15%; now ~0.19–0.25% run to run). The floor
      // only guards against the hats / clicks disappearing altogether.
      // round 3 darkens the hats again (round 2 measured 0.19–0.25 %): the floor only guards against them vanishing
      check('groove: 2–8 kHz presence in [0.08%, 8%] (crisp, not piercing)', pres >= 0.08 && pres <= 8, pres.toFixed(2) + '%');
      check('groove: no 4 kHz spike (oct4k − avg(2k,8k) < 3 dB)', spike < 3, f1(spike) + ' dB');
      check('groove: intro quieter than beat', intro.rms < beat.rms - 3, f1(intro.rms) + ' vs ' + f1(beat.rms));
      plot('groove pass 1 — 8 bars (waveform ±1 / -1 dB / -6 dB guides; log spectrogram 30 Hz–20 kHz)', buf,
        [0, 1, 2, 3, 4, 5, 6, 7].map(b => ({ t: 0.05 + b * BAR, label: 'bar ' + (b + 1) })));
    }

    /* 2b. groove: second pass (loop steady state, riser into bar 1) */
    if (want('groove')) {
      const T = 4 * BAR + 0.3;
      const { buf } = await render(T, (E) => {
        const g = E.makeGroove(E.master);
        for (let s = 112; s < 176; s++) g.step(s, 0.05 + (s - 112) * sd);
      });
      const st = stats(buf, 0.05, 0.05 + 4 * BAR);
      results.groove2 = st;
      noteHF('groove pass 2', buf, 0.05, 0.05 + 4 * BAR, 'groove');
      log('  pass 2 (bar 8 of pass 1 → bars 1–3 of pass 2): RMS ' + f1(st.rms) + ' dBFS   peak ' + f1(st.peak) + '   clips ' + st.clips);
      check('groove pass 2: no clipping, RMS in [-18, -13]', st.clips === 0 && st.rms >= -18 && st.rms <= -13, f1(st.rms));
    }

    /* 2c. groove mix breakdown: each part soloed (beat section, bars 3–8) */
    if (want('groove')) {
      const PARTS = ['kick', 'sub', 'hats', 'perc', 'bed', 'keys', 'micro'];
      log('  mix breakdown (each part soloed, bars 3–8):');
      results.parts = {};
      for (const solo of PARTS) {
        const T = 8 * BAR + 0.3;
        const { buf } = await render(T, (E) => {
          const parts = {}; PARTS.forEach(p => { parts[p] = p === solo ? 1 : 0; });
          const g = E.makeGroove(E.master, { parts });
          for (let s = 0; s < 128; s++) g.step(s, 0.05 + s * sd);
        });
        const st = stats(buf, 0.05 + 2 * BAR, 0.05 + 8 * BAR), sp = spectrum(buf, 0.05 + 2 * BAR, 16), oc = octaves(sp);
        let tot = 0; for (let k = 1; k < sp.P.length; k++) tot += sp.P[k];
        const octAbs = OCT.map((fc, i) => oc[i]);
        results.parts[solo] = { rms: st.rms, peak: st.peak };
        noteHF('part ' + solo, buf, 0.05 + 2 * BAR, 16, 'parts');
        const th3 = bandDb(sp, 3150 / Math.pow(2, 1 / 6), 3150 * Math.pow(2, 1 / 6)), th6 = bandDb(sp, 6300 / Math.pow(2, 1 / 6), 6300 * Math.pow(2, 1 / 6));
        log('    ' + pad(solo, 6) + ' rms ' + pad(f1(st.rms), 6) + ' pk ' + pad(f1(st.peak), 6) + ' 1/3-oct 3.15k ' + pad(f1(th3), 6) + ' 6.3k ' + pad(f1(th6), 6) + ' octaves ' + OCT.map((f, i) => (f >= 1000 ? f / 1000 + 'k' : f) + ' ' + f1(octAbs[i])).join(' '));
      }
    }

    /* 3. every instrument, one at a time (tonal ones play a short phrase in the key) */
    if (want('inst')) {
      const D = A.degree;
      const items = [
        ['click', 1.2, (E, t) => { for (let i = 0; i < 8; i++) E.play.click({ when: t + i * 0.11 }); }],
        ['tick', 1.2, (E, t) => [0, 1, 2, 3, 4, 5, 6].forEach(i => E.play.tick(D(i, 2), { when: t + i * sd }))],
        ['bit', 1.2, (E, t) => [0, 2, 4, 1, 3, 5].forEach((d, i) => E.play.bit(D(d, 2), { when: t + i * sd, steps: [8, 4, 16, 'pulse'][i % 4] }))],
        ['data', 1.2, (E, t) => E.play.data({ when: t, dur: 0.7, density: 50 })],
        ['grain', 1.4, (E, t) => [0, 2, 4, 5, 7, 9].forEach((d, i) => E.play.grain(D(d, 1), { when: t + i * sd, bright: i / 5, dur: 0.05 + 0.012 * i }))],
        ['glitch', 1.6, (E, t) => { E.play.glitch({ when: t }); E.play.glitch({ when: t + 0.5, midi: 86 }); E.play.glitch({ when: t + 1.0, shape: 'grow', crush: true }); }],
        ['ratchet', 1.0, (E, t) => { E.play.ratchet({ when: t }); E.play.ratchet({ when: t + 0.4, count: 6, span: sd * 2 }); }],
        ['sub', 1.6, (E, t) => [38, 38, 45, 43].forEach((m, i) => E.play.sub(m, { when: t + i * 2 * sd, dur: sd * 1.5 }))],
        ['kick', 1.0, (E, t) => E.play.kick({ when: t })],
        ['hat', 1.0, (E, t) => { for (let i = 0; i < 6; i++) E.play.hat({ when: t + i * sd }); E.play.hat({ when: t + 6 * sd, open: true }); }],
        ['snare', 1.0, (E, t) => { E.play.snare({ when: t, crush: false }); E.play.snare({ when: t + 0.4, crush: true }); }],
        ['clap', 1.0, (E, t) => E.play.clap({ when: t })],
        ['shaker', 1.0, (E, t) => [0, 1, 2, 3].forEach(i => E.play.shaker({ when: t + i * sd }))],
        ['pluck', 1.6, (E, t) => [62, 66, 69, 74, 71, 69].forEach((m, i) => E.play.pluck(m, { when: t + i * sd * 1.5 }))],
        ['keys', 2.2, (E, t) => { [62, 66, 69].forEach(m => E.play.keys(m, { when: t, dur: 1 })); [78, 76, 74].forEach((m, i) => E.play.keys(m, { when: t + 0.35 + i * sd * 3, dur: 0.4 })); }],
        ['bell', 2.0, (E, t) => [81, 78, 86].forEach((m, i) => E.play.bell(m, { when: t + i * sd * 3 }))],
        ['pad', 2.6, (E, t) => E.play.pad([50, 57, 62, 64, 69], { when: t, dur: 1.5, attack: 0.4, release: 0.6 })],
        ['bass', 1.4, (E, t) => { E.play.bass(38, { when: t, dur: 0.3 }); E.play.bass(50, { when: t + 0.4, dur: 0.3, from: 38 }); E.play.bass(45, { when: t + 0.8, dur: 0.3 }); }],
        ['lead', 1.6, (E, t) => { E.play.lead(74, { when: t, dur: 0.6, from: 69 }); E.play.lead(78, { when: t + 0.7, dur: 0.5 }); }],
        ['noise', 1.0, (E, t) => E.play.noise({ when: t, dur: 0.5, filter: 'bandpass', freq: 1200, q: 1 })],
        ['riser', 1.8, (E, t) => E.play.riser({ when: t, dur: 1.4 })],
        ['impact', 2.0, (E, t) => E.play.impact({ when: t })],
        ['blip', 1.0, (E, t) => [74, 78, 81].forEach((m, i) => E.play.blip(m, { when: t + i * 0.1 }))]
      ];
      const starts = []; let acc = 0.05;
      items.forEach(it => { starts.push(acc); acc += it[1]; });
      const { buf } = await render(acc + 0.5, (E) => items.forEach((it, i) => it[2](E, starts[i])));
      log('');
      log('INSTRUMENTS (each alone, default gain=1 → master)');
      let row = [];
      results.instruments = {};
      items.forEach((it, i) => {
        const s = stats(buf, starts[i] - 0.04, starts[i] + it[1] - 0.04);
        results.instruments[it[0]] = s;
        noteHF('inst ' + it[0], buf, starts[i] - 0.04, starts[i] + it[1] - 0.04, 'instruments');
        row.push(pad(it[0], 7) + ' pk ' + pad(f1(s.peak), 6) + ' rms ' + pad(f1(s.rms), 6));
        if (row.length === 3) { log('  ' + row.join('   |  ')); row = []; }
        check('instrument ' + it[0] + ': finite, no clip, audible', s.nans === 0 && s.clips === 0 && isFinite(s.peak) && s.peak > -45 && s.peak < -1, f1(s.peak));
      });
      if (row.length) log('  ' + row.join('   |  '));
      plot('instruments — ' + items.map(x => x[0]).join(' · '), buf, items.map((it, i) => ({ t: starts[i], label: it[0] })));
    }

    /* 3b. hat voice: the default hat against a darker-looking tone 0.8 (a lower high-pass corner), 1/3-octave
           levels. A lower corner adds presence at 2.5–5 kHz, where the ear is most sensitive. */
    if (want('hat')) {
      const TO = [2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500];
      const hatRun = async (o) => {
        const { buf } = await render(4.3, (E) => { for (let i = 0; i < 32; i++) E.play.hat(Object.assign({ when: 0.3 + i * sd, gain: 1, pan: 0 }, o)); });
        const sp = spectrum(buf, 0.25, 4.3);
        return TO.map(fc => bandDb(sp, fc / Math.pow(2, 1 / 6), fc * Math.pow(2, 1 / 6)));
      };
      const h1 = await hatRun({}), h08 = await hatRun({ tone: 0.8 });
      results.hat = { TO, h1, h08 };
      log('');
      log('HAT VOICE (32 closed hats, 1/3-oct dBFS)   ' + TO.map(f => pad(f >= 1000 ? f / 1000 + 'k' : f, 6)).join(''));
      log('  default (tone 1)                        ' + h1.map(x => pad(f1(x), 6)).join(''));
      log('  tone 0.8                                ' + h08.map(x => pad(f1(x), 6)).join(''));
      const pres = (a) => 10 * Math.log10([1, 2, 3].reduce((s, q) => s + Math.pow(10, a[q] / 10), 0));
      const air = (a) => 10 * Math.log10([6, 7, 8].reduce((s, q) => s + Math.pow(10, a[q] / 10), 0));
      log('  presence 2.5–5 kHz: tone 1 ' + f1(pres(h1)) + ' / tone 0.8 ' + f1(pres(h08)) + ' dBFS   ·   air 8–12.5 kHz: tone 1 ' + f1(air(h1)) + ' / tone 0.8 ' + f1(air(h08)) + ' dBFS');
      // round-2 hat (the engine before this pass), same page: presence -55.3 dBFS, air -46.1 dBFS
      const R2HAT = { h1: [-71.9, -66.6, -62.3, -56.7, -52.7, -50.4, -49.7, -50.5, -52.9], pres: -55.3, air: -46.1 };
      log('  round 2 (tone 1)                        ' + R2HAT.h1.map(x => pad(f1(x), 6)).join('') + '  → air Δ ' + f1(air(h1) - R2HAT.air) + ' dB, presence Δ ' + f1(pres(h1) - R2HAT.pres) + ' dB');
      check('hat: air (8–12.5 kHz) ≥ 2 dB under round 2, presence (2.5–5 kHz) not up (≤ +1 dB)', air(h1) - R2HAT.air <= -2 && pres(h1) - R2HAT.pres <= 1, f1(air(h1) - R2HAT.air) + ' / ' + f1(pres(h1) - R2HAT.pres) + ' dB');
      check('hat: tone 0.8 adds presence (so scenes use tone ≥ 1)', pres(h08) > pres(h1), f1(pres(h08) - pres(h1)) + ' dB');
    }

    /* 4. UI sounds */
    if (want('ui')) {
      const items = [
        ['hover', (E, t) => { for (let i = 0; i < 5; i++) E.ui.hover({ when: t + i * 0.12 }); }],
        ['tick', (E, t) => { E.ui.tick({ when: t }); E.ui.tick({ when: t + 0.25 }); }],
        ['select', (E, t) => E.ui.select({ when: t })],
        ['open', (E, t) => E.ui.open({ when: t })],
        ['close', (E, t) => E.ui.close({ when: t })],
        ['type', (E, t) => [0, 1, 2, 3, 4, 5].forEach(i => E.ui.type({ when: t + i * 0.085 }))],
        ['error', (E, t) => E.ui.error({ when: t })],
        ['trans1', (E, t) => E.ui.transition(1, { when: t })],
        ['trans2', (E, t) => E.ui.transition(2, { when: t })],
        ['trans3', (E, t) => E.ui.transition(3, { when: t })],
        ['trans4', (E, t) => E.ui.transition(4, { when: t })],
        ['trans5', (E, t) => E.ui.transition(5, { when: t })]
      ];
      const SLOT = 1.2;
      const { buf } = await render(items.length * SLOT + 0.5, (E) => items.forEach((it, i) => it[1](E, 0.05 + i * SLOT)));
      log('');
      log('UI SOUNDS (target peak −36…−26 dBFS)');
      let row = [];
      results.ui = {};
      items.forEach((it, i) => {
        const s = stats(buf, i * SLOT, (i + 1) * SLOT);
        results.ui[it[0]] = s;
        noteHF('ui ' + it[0], buf, i * SLOT, (i + 1) * SLOT, 'ui');
        row.push(pad(it[0], 7) + ' pk ' + pad(f1(s.peak), 6));
        if (row.length === 6) { log('  ' + row.join(' | ')); row = []; }
        check('ui ' + it[0] + ': peak in [-40, -24) dBFS', s.peak < -24 && s.peak > -40 && s.nans === 0, f1(s.peak));
      });
      if (row.length) log('  ' + row.join(' | '));
      plot('ui — ' + items.map(x => x[0]).join(' · '), buf, items.map((it, i) => ({ t: 0.05 + i * SLOT, label: it[0] })));
    }

    /* 5. continuous sources, driven with offline suspend/resume + grain pumps like a live page */
    if (want('cont')) {
      const T = 34;
      let granCount = 0;
      const { buf } = await render(T, (E, ctx) => {
        let gr, d, w1, h, w2;
        drive(ctx, E, [
          [0.05, () => { gr = E.granular({ density: 14, pitch: [74, 76, 78, 81, 86], attack: 0.5 }); }],
          [2.5, () => gr.set({ density: 45, dur: 0.035, bright: 0.85, pitch: [86, 88, 90, 93, 98] }, 1.2)],

    /* 5b. scene beds while a scene is paused / settled — the owner's "flute whistle". Two blocks:

       (2) AS THEY SHIP: the parameters the scene files pass today (file:line in each label).
       Routed through a scene bus like on the site. Measured on 2–8 s: where the strongest spectral line
       sits, the centroid, the energy above 600 Hz and 1.2 kHz, and the strongest line above 1.2 kHz. */
    async function bedBlock(title, BEDS, prefix, noteGroup, strict) {
      const T = 8.3;
      log('');
      log(title);
      log('  ' + pad('', 22) + 'rms    strongest line  centroid   >600 Hz  >1.2 kHz (dBFS)        top tonal line >1.2 kHz re strongest');
      const bedBufs = [];
      for (const [name, build] of BEDS) {
        const { buf } = await render(T, build);
        const sp = spectrum(buf, 2, 8);
        // a "tonal line" is a local maximum standing ≥ 8 dB above the median of ±25 bins (±290 Hz),
        // so broadband wind / noise does not count, a sustained grain partial does
        const med = k => { const a = []; for (let j = Math.max(1, k - 25); j <= Math.min(sp.P.length - 1, k + 25); j++) if (Math.abs(j - k) > 2) a.push(sp.P[j]); a.sort((x, y) => x - y); return a[a.length >> 1] || 1e-30; };
        let pk = 0, pkF = 0, hiPk = 0, hiF = 0, tot = 0, hi = 0, hi6 = 0, cen = 0;
        for (let k = 1; k < sp.P.length; k++) {
          const f = k * sp.df, p = sp.P[k];
          tot += p; cen += f * p;
          if (f >= 1200) hi += p;
          if (f >= 600) hi6 += p;
          if (f >= 80 && p > pk) { pk = p; pkF = f; }
          if (f >= 1200 && f < 12000 && p > hiPk && p >= sp.P[k - 1] && p >= (sp.P[k + 1] || 0) && p > 6.3 * med(k)) { hiPk = p; hiF = f; }
        }
        const r = { rms: bandDb(sp, 0, SR), line: pkF, centroid: cen / (tot || 1), hiPct: 100 * hi / (tot || 1), hi6Pct: 100 * hi6 / (tot || 1), hiDb: bandDb(sp, 1200, SR), hiLine: hiF, hiRel: 10 * Math.log10((hiPk || 1e-30) / (pk || 1e-30)) };
        results.beds[prefix + name] = r;
        noteHF(prefix + name, buf, 2, 8, noteGroup);
        bedBufs.push(buf);
        log('  ' + pad(name, 22) + pad(f1(r.rms), 7) + pad(Math.round(r.line) + ' Hz', 16) + pad(Math.round(r.centroid) + ' Hz', 11) + pad(r.hi6Pct.toFixed(2) + '%', 9) +
          pad(r.hiPct.toFixed(2) + '% (' + f1(r.hiDb) + ')', 23) + (hiF ? Math.round(r.hiLine) + ' Hz at ' + f1(r.hiRel) + ' dB' : 'none'));
        const tonal = !/wind/.test(name);
        const tag = strict ? 'bed (ships) ' : 'fold net ';

      bedBufs.forEach((b, i) => { all.getChannelData(0).set(b.getChannelData(0), i * n); all.getChannelData(1).set(b.getChannelData(1), i * n); });
      plot(title.toLowerCase() + ' — ' + BEDS.map(x => x[0]).join(' · '), all, BEDS.map((b, i) => ({ t: i * T, label: b[0] })));

        const ex = x.reduce((s, v) => s + v * v, 0), ey = y.reduce((s, v) => s + v * v, 0);
        let best = 0;
        for (let lag = -240; lag <= 240; lag += 2) { let c = 0; for (let i = Math.max(0, -lag); i < Math.min(n, n - lag); i++) c += x[i] * y[i + lag]; best = Math.max(best, Math.abs(c) / Math.sqrt(ex * ey || 1)); }
        results.keyCorr = best;
        log('  two identical key({ vel: 0.8 }) calls: best normalized correlation (±5 ms) ' + best.toFixed(3) + '  (1.000 = the same sound)');
        check('foley key: two hits never identical (correlation < 0.97)', best < 0.97, best.toFixed(3));
      }

      // level stability: the voices ring resonators with a 5-sample pulse, so a hit keeps its level wherever it
      // starts between two samples (a one-sample impulse — play.click — swings with the sub-sample start)
      {
        const run = async (fn) => {
          const { buf: lb } = await render(6.3, (E, ctx) => { for (let i = 0; i < 20; i++) fn(E, ctx, 0.1 + i * 0.3 + Math.random() / SR * 0.999 + (i * 0.37 % 1) / SR); });
          const pks = []; for (let i = 0; i < 20; i++) pks.push(stats(lb, 0.09 + i * 0.3, 0.37 + i * 0.3).peak);
          return { spread: Math.max(...pks) - Math.min(...pks), mean: pks.reduce((s, x) => s + x, 0) / pks.length };
        };
        const kS = await run((E, ctx, t) => E.play.key({ when: t, vel: 0.8, up: 0, room: 0, dest: ctx.destination }));
        const sS = await run((E, ctx, t) => E.play.snap({ when: t, room: 0, dest: ctx.destination }));
        const cS = await run((E, ctx, t) => E.play.click({ when: t, freq: 2500, q: 2, dest: ctx.destination }));
        results.levelSpread = { key: kS, snap: sS, click: cS };
        log('  per-hit peak spread over 20 hits at random sub-sample starts: key ' + f1(kS.spread) + ' dB, snap ' + f1(sS.spread) + ' dB   (play.click, one-sample impulse: ' + f1(cS.spread) + ' dB)');
        check('foley key / snap: per-hit level stable (spread ≤ 6 dB at random sub-sample starts)', kS.spread <= 6 && sS.spread <= 6, f1(kS.spread) + ' / ' + f1(sS.spread) + ' dB');
      }

      // continuous beds: CNC (rate / load moves) and fan (speed move), then stop()
      {
        const { buf: cb } = await render(14, (E, ctx) => {
          let c, f;
          drive(ctx, E, [
            [0.05, () => { c = E.cnc({ rate: 0.3, load: 0, attack: 0.5 }); }],
            [1.6, () => c.set({ rate: 1, load: 0 }, 0.8)],
            [3.2, () => c.set({ load: 0.8 }, 0.5)],
            [5.2, () => c.stop(0.8)],
            [7, () => { f = E.fan({ speed: 0.3, attack: 0.6 }); }],
            [9, () => f.set({ speed: 1 }, 1)],
            [11.6, () => f.stop(0.6)]
          ]);
        });
        const rows = [['cnc idle (rate .3)', 0.9, 1.6], ['cnc full speed', 2.4, 3.2], ['cnc cutting (load .8)', 3.8, 5.2], ['fan speed .3', 7.8, 9], ['fan speed 1', 10, 11.6]];
        results.foleyBeds = {};
        log('  continuous:' + pad('', 13) + pad('rms', 7) + pad('pk', 7) + FB.map(b => pad(b[2], 8)).join('') + pad('laptop', 8) + 'strongest line · top tonal line >1.2 kHz');
        rows.forEach(([name, a, b]) => {
          const s = stats(cb, a, b), sp = spectrum(cb, a, b), bd = bandsOf(sp, FB), ss = smallSpk(spectrum(cb, a, b, 8192)), ln = lines(sp);
          results.foleyBeds[name] = { rms: s.rms, peak: s.peak, line: ln.line, hiLine: ln.hiLine, hiRel: ln.hiRel, lap: ss.lapD };
          noteHF('foley ' + name, cb, a, b, 'foley');
          log('    ' + pad(name, 22) + pad(f1(s.rms), 7) + pad(f1(s.peak), 7) + bd.map(x => pad(x.pct.toFixed(1), 8)).join('') + pad(f1(ss.lapD), 8) +
            Math.round(ln.line) + ' Hz · ' + (ln.hiLine ? Math.round(ln.hiLine) + ' Hz at ' + f1(ln.hiRel) + ' dB' : 'none'));
          check('foley ' + name + ': subtle bed (RMS in [−48, −26] dBFS), no clip', s.rms >= -48 && s.rms <= -26 && s.clips === 0, f1(s.rms));
          check('foley ' + name + ': sustained tone stays low (strongest line < 600 Hz)', ln.line < 600, Math.round(ln.line) + ' Hz');
          check('foley ' + name + ': no whistle (no tonal line >1.2 kHz within 18 dB)', !ln.hiLine || ln.hiRel < -18, ln.hiLine ? f1(ln.hiRel) + ' dB @ ' + Math.round(ln.hiLine) : 'none');
        });
        const tC = stats(cb, 6.5, 6.9), tF = stats(cb, 13.3, 13.9), jb = jump(cb, 0.04, 14);
        log('    after stop(): cnc ' + f1(tC.rms) + ' dBFS, fan ' + f1(tF.rms) + ' dBFS;  largest step over the whole render ' + jb.toFixed(2) + ' × peak');
        check('foley cnc / fan: stop() silences (< −70 dBFS RMS after the release)', tC.rms < -70 && tF.rms < -70, f1(tC.rms) + ' / ' + f1(tF.rms));
        check('foley cnc / fan: click-free start, moves and stop (largest step < 0.3 × peak)', jb < 0.3, jb.toFixed(2));
        plot('continuous — cnc (rate .3 → 1 at 1.6 s, load .8 at 3.2 s, stop 5.2 s) · fan (speed .3 → 1 at 9 s, stop 11.6 s)', cb, [{ t: 0.05, label: 'cnc' }, { t: 7, label: 'fan' }]);
      }

      // the lab's demo phrase through a scene bus with the engine's default voice cap (56)
      {
        const ph = A.assemblyPhrase(), T = ph.duration + 0.6, t0 = 0.1;
        let vmax = 0, nEv = 0;
        const { buf: pb } = await render(T, (E, ctx) => {
          const st = {}, bus = E.bus('build');
          drive(ctx, E, ph.events.map(([t, fn]) => [t0 + t - 0.03, () => { fn(E, t0 + t, bus, st); nEv++; vmax = Math.max(vmax, E.voiceCount()); }]));
        }, { maxVoices: 56 });
        const mk = ph.marks.map(m => ({ t: t0 + m.t, label: m.label }));
        const seg = (a, b) => stats(pb, a, b);
        const P = {
          silence: seg(mk[0].t, mk[1].t), prompt: seg(mk[1].t, mk[2].t),
          grid1: seg(mk[2].t, (mk[2].t + mk[3].t) / 2), grid2: seg((mk[2].t + mk[3].t) / 2, mk[3].t),
          engine: seg(mk[3].t, mk[4].t), resolve: seg(mk[4].t, mk[5].t), bed: seg(mk[5].t, t0 + ph.duration - 1.5)
        };
        const all = stats(pb), tail = stats(pb, T - 0.35, T);
        results.phrase = { P, all, vmax, nEv };
        log('');
        log('BITS & ATOMS — the demo phrase (Site.audio.assemblyPhrase, ' + f1(ph.duration) + ' s, ' + ph.events.length + ' events, via a scene bus, voice cap 56)');
        log('  ' + ph.marks.map(m => f1(m.t) + ' s ' + m.label).join('  ·  '));
        log('  RMS by phase: ' + Object.keys(P).map(k => k + ' ' + f1(P[k].rms)).join('   ') + '  dBFS');
        log('  peak ' + f1(all.peak) + ' dBFS   clips ' + all.clips + '   NaN ' + all.nans + '   most voices sounding at once ' + vmax + '   tail ' + f1(tail.rms) + ' dBFS');
        log('  RMS per 1 s: ' + windows(pb, 1).map(x => f1(x.rms)).join(' '));
        const pbS = spectrumReport('phrase', pb, mk[3].t, mk[4].t);
        results.phraseSpectrum = pbS;
        check('phrase: no clipping, no NaN, peak ≤ −3 dBFS', all.clips === 0 && all.nans === 0 && all.peak <= -3, f1(all.peak));
        check('phrase: minimal → maximal (prompt RMS ≥ 8 dB under the engine)', P.prompt.rms <= P.engine.rms - 8, f1(P.prompt.rms) + ' vs ' + f1(P.engine.rms));
        check('phrase: accelerating layers build (grid 1st half < 2nd half < engine)', P.grid1.rms < P.grid2.rms && P.grid2.rms < P.engine.rms, f1(P.grid1.rms) + ' < ' + f1(P.grid2.rms) + ' < ' + f1(P.engine.rms));
        check('phrase: the chill bed sits ≥ 5 dB under the engine, and ends in silence', P.bed.rms <= P.engine.rms - 5 && tail.rms < -60, f1(P.bed.rms) + ' / tail ' + f1(tail.rms));
        check('phrase: fits the voice cap (≤ 56 voices sounding at once)', vmax <= 56, vmax);
        plot('bits & atoms demo phrase — ' + ph.marks.map(m => m.label).join(' → '), pb, mk);
      }
    }

    /* 8. high-frequency energy per section, before (round-1 engine) vs now */
    if (want('hf')) {
      log('');
      log('HIGH-FREQUENCY ENERGY per section: share of energy above 4 kHz and 8 kHz, and its level (mono dBFS RMS).');
      log('Before = the round-1 engine, measured with this same page (' + (BEFORE ? 'baseline embedded below' : 'no baseline') + '). Δ = now − before; negative = less high end.');
      log('  ' + pad('section', 22) + pad('rms', 7) + pad('>4k %', 8) + pad('>4k dB', 8) + pad('>8k %', 8) + pad('>8k dB', 8) + (BEFORE ? pad('before >4k/>8k dB', 19) + 'Δ>4k   Δ>8k' : ''));
      const agg = {};
      let n4 = 0, n8 = 0, nb = 0;
      HF_ORDER.forEach(name => {
        const h = HF[name], b = BEFORE && BEFORE[name];
        let tail = '';
        if (b) {
          const x4 = h.d4 - b[0], x8 = h.d8 - b[1];
          h.x4 = x4; h.x8 = x8; nb++;
          if (x4 < 0) n4++; if (x8 < 0) n8++;
          tail = pad(f1(b[0]) + ' / ' + f1(b[1]), 19) + pad((x4 >= 0 ? '+' : '') + f1(x4), 7) + (x8 >= 0 ? '+' : '') + f1(x8);
          (agg[h.group] = agg[h.group] || []).push(h);
        }
        log('  ' + pad(name, 22) + pad(f1(h.rms), 7) + pad(h.p4.toFixed(2), 8) + pad(f1(h.d4), 8) + pad(h.p8.toFixed(2), 8) + pad(f1(h.d8), 8) + tail);
      });
      results.hf = HF;
      if (BEFORE) {
        log('  → ' + n4 + '/' + nb + ' sections have less energy above 4 kHz, ' + n8 + '/' + nb + ' less above 8 kHz.');
        const mean = (arr, k) => arr.reduce((s, h) => s + h[k], 0) / arr.length;
        log('  group mean Δ (dB):  ' + Object.keys(agg).map(g => g + ' >4k ' + f1(mean(agg[g], 'x4')) + ' / >8k ' + f1(mean(agg[g], 'x8'))).join('   '));
        log('  (groove / parts / stress rows are LAB-ONLY: no scene plays the groove. The rows below are the numbers that ship.)');
        // the numbers that ship: the instruments the scenes and the scene-5 score actually play, vs round 1 (and round 2)
        const SHIP = ['inst hat', 'inst click', 'inst tick', 'inst snare', 'inst clap', 'inst ratchet', 'inst glitch', 'inst bit', 'inst data', 'inst grain', 'inst keys', 'inst pluck'];
        log('  NUMBERS THAT SHIP (instrument level, energy above 4 kHz, dB vs round 1' + (R2 ? ' / vs round 2' : '') + '):');
        log('    ' + SHIP.filter(n => HF[n] && isFinite(HF[n].x4)).map(n => n.slice(5) + ' ' + (HF[n].x4 >= 0 ? '+' : '') + f1(HF[n].x4) +
          (R2 && R2[n] ? ' / ' + ((HF[n].d4 - R2[n][0]) >= 0 ? '+' : '') + f1(HF[n].d4 - R2[n][0]) : '')).join('   '));
        ['groove whole', 'groove intro', 'groove beat', 'groove pass 2', 'stress'].forEach(name => {
          const h = HF[name];
          if (h && isFinite(h.x4)) check('HF dropped (lab): ' + name + ' (>4k and >8k, dB)', h.x4 < -1 && h.x8 < -1, f1(h.x4) + ' / ' + f1(h.x8));
        });
        // random-voiced instruments (click freq, hat corner) vary ±1.5 dB run to run here (click: −2.8…−6.2 dB over six runs)
        ['inst hat', 'inst click', 'inst tick'].forEach(name => {
          const h = HF[name];
          if (h && isFinite(h.x4)) check('HF dropped (ships): ' + name + ' >4k vs round 1 ≤ −2 dB', h.x4 <= -2, f1(h.x4) + ' dB');
        });
        Object.keys(agg).forEach(g => {
          if (g === 'groove' || g === 'stress') return;
          check('HF dropped: ' + g + ' (group mean >4k, >8k)', mean(agg[g], 'x4') < -1 && mean(agg[g], 'x8') < -1, f1(mean(agg[g], 'x4')) + ' / ' + f1(mean(agg[g], 'x8')));
        });
        check('HF dropped in ≥ 85% of sections (>4k)', n4 >= 0.85 * nb, n4 + '/' + nb);
      }
    }
  } catch (e) {
    window.__errors.push('check threw: ' + (e && e.stack || e));
  }

  log('');
  log('CHECKS');
  checks.forEach(c => log('  ' + (c.ok ? 'PASS ' : 'FAIL ') + pad(c.name, 52) + ' ' + c.detail));
  const failed = checks.filter(c => !c.ok).length;
  log('');
  log('ERRORS (' + window.__errors.length + ')' + (window.__errors.length ? '\n  ' + window.__errors.join('\n  ') : ''));
  log('SUMMARY: ' + (checks.length - failed) + '/' + checks.length + ' checks passed, ' + window.__errors.length + ' errors');
  document.getElementById('report').textContent = out.join('\n');
  document.title = 'Audio check — ' + (failed || window.__errors.length ? 'FAIL' : 'PASS');
  window.__results = results;
  window.__hf = HF;
  window.__done = true;
})();
</script>
</body>
</html>
