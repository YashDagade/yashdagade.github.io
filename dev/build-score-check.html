  What this page does: it renders the score offline (OfflineAudioContext + Site.audio.createEngine, the same engine
  as the site) and measures it. ?only=quick runs the full-track section alone (about 20 s); the whole page takes a
  few minutes. Sections:
    1  FULL TRACK: the score as the film plays it (with the film's typing windows): levels per bar and section,
       the arc, the master glue, HF, whistle, registers, the resolution and the crossfade, position(), cues
    2  PALETTE: the voices it is made of (Bits & Atoms, no drum kit), registers, the accelerando, density
    3  THE FILM MIX: the score + an emulation of build.js's on-screen foley (a snapshot of its events,
       voiced as foleyFire() voices them), and how far the typing stands out of the score
    4  SMALL SPEAKER: the engine's small-speaker body on this score (createEngine { body: 0 } → now)
    5  TYPING vs SCORE: per-event peaks of the film's keystrokes and the score's key parts
    6  LATENCY, TRANSPORT, RESUME (the riser, the fan), MIX (groups soloed, parts{} mute)
-->

  if (/HeadlessChrome/.test(navigator.userAgent)) {
    let sink = 0;
    (function keep() {
      if (window.__done) return;
      for (let i = 0; i < 4e6; i++) sink += Math.sqrt(i);
      window.__sink = sink;
      setTimeout(keep, 0);
    })();

        log(`3 · THE FILM MIX (score + build.js's on-screen foley, emulated from the snapshot)   peak ${f1(mst.peak)}  RMS ${f1(mst.rms)}  clips ${mst.clips}  max voices ${mixR.info.maxVoices}`);
        log('  section RMS, score + foley: ' + BS.sections.map(s => s.name + ' ' + f1(MS(s.name).rms)).join(' · '));
        // how far each keystroke stands out of the score: its 1–5 kHz band-passed peak, foley alone vs score alone
        const scoreOnly = buf;
        const margins = KEYSTROKES.map(e => ({ t: e.t, m: bandPeak(fb, 0.01 + e.t) - bandPeak(scoreOnly, fstart + e.t) })).filter(x => isFinite(x.m));
        const bySec = BS.sections.map(s => [s.name, median(margins.filter(x => x.t >= T(s.bar) && x.t < T(s.bar + s.bars)).map(x => x.m))]).filter(x => isFinite(x[1]));
        const mAll = median(margins.map(x => x.m)), low = margins.filter(x => x.m < 0).length;
        log(`  keystroke presence (1–5 kHz band-passed peak, foley alone − score alone, dB): median ${sgn(mAll)}; per section ${bySec.map(x => x[0] + ' ' + sgn(x[1])).join(' · ')}; under the score: ${low} of ${margins.length}`);
        check('the film\'s typing stands out of the score (keystrokes\' 1–5 kHz peak ≥ +5 dB over the score median, ≥ +2 dB in every section)', mAll >= 5 && bySec.every(x => x[1] >= 2), sgn(mAll) + ' dB median, worst section ' + sgn(Math.min(...bySec.map(x => x[1]))));
        check('film mix: no clipping, peak ≤ -0.5 dBFS', mst.clips === 0 && mst.peak <= -0.5, f1(mst.peak) + ' dBFS, ' + mst.clips + ' clips');
        const vb = mixR.info.vbar || [], vTop = vb.map((v, i) => [v, i + 1]).sort((x, y) => y[0] - x[0]).slice(0, 4);
        log(`  live voices, score + foley: max ${mixR.info.maxVoices}; busiest bars ${vTop.map(x => 'bar ' + x[1] + ' ' + x[0]).join(' · ')} (engine cap 56: past it the oldest voices are cut, the long risers first)`);
        check('film mix: voices stay under the engine cap with headroom (≤ 52)', mixR.info.maxVoices <= 52, mixR.info.maxVoices);
        log('');
        plot('The film mix: the score + build.js\'s on-screen foley (emulated). Blue marks = sections.', mb, BS.sections.map(s => ({ t: T(s.bar) + 0.01, label: s.name })));
        plot('The film mix, bars 1–8: one keystroke, one servo, the latch; the command; the title typed; the beat enters (bar 5).', mb,
          [{ t: 0.01, label: 'bar 1' }, { t: 0.01 + T(2), label: 'bar 2 (Enter)' }, { t: 0.01 + T(3), label: 'bar 3' }, { t: 0.01 + T(5), label: 'bar 5' }], 0, 0.01 + T(9));
      }

      /* 4. SMALL SPEAKER (round 4): the same track on the engine without the small-speaker body ({ body: 0 }) → now */
      {
        const old = await render(LEN, [[0, s => s.play(0)]], { meter: true, engine: { body: 0 } });
        const ob = old.buf, oPre = [];
        for (let b = 1; b <= BS.bars; b++) oPre.push(db(Math.max(0, ...inSec(old.info.pre, T(b), T(b + 1)))));
        const arrow = (a, b, d = 1) => pad(a.toFixed(d) + ' → ' + b.toFixed(d), 15);
        log('4 · SMALL SPEAKER: energy < 150 Hz and 150–900 Hz, mid−low = 150–900 Hz band re < 150 Hz band, and the level kept');
        log(`  through a speaker model re full range (4th-order high-pass: laptop ${SS_LAPTOP} Hz, phone ${SS_PHONE} Hz). engine { body: 0 } → now. 8192-point spectra.`);
        log('  ' + pad('section', 18) + pad('RMS dBFS', 16) + pad('<150 Hz %', 15) + pad('150–900 %', 15) + pad('mid−low dB', 16) + pad('laptop Δ dB', 16) + pad('phone Δ dB', 16) + pad('<150 dB (kept)', 17) + '>900 dB');
        const SSR = {};
        const rowSS = (name, a, b) => {
          const s0 = stats(ob, a, b), s1 = stats(buf, a, b);
          const x = smallSpk(spectrum(ob, a, b, 8192)), y = smallSpk(spectrum(buf, a, b, 8192));
          SSR[name] = { b: x, n: y, rb: s0.rms, rn: s1.rms };
          log('  ' + pad(name, 18) + arrow(s0.rms, s1.rms) + ' ' + arrow(x.pLo, y.pLo) + arrow(x.pMid, y.pMid) + ' ' + arrow(x.midLo, y.midLo) + ' ' + arrow(x.lapD, y.lapD) + ' ' + arrow(x.phD, y.phD) + ' ' +
            pad(f1(x.lo) + ' → ' + f1(y.lo), 17) + f1(x.hi) + ' → ' + f1(y.hi));
        };
        BS.sections.forEach(s => rowSS(s.name, ft(T(s.bar)), ft(T(s.bar + s.bars))));
        rowSS('whole 1–44', ft(0), ft(DUR));
        const preOld = Math.max(...oPre), preNow = preTop[0][0];
        log(`  pre-glue peak (loudest bar): ${sgn(preOld)} → ${sgn(preNow)} dBFS;  peak ${f1(stats(ob, 0, LEN).peak)} → ${f1(st.peak)} dBFS`);
        log('');
        const W = SSR['whole 1–44'], lapUp = x => x.n.lapD - x.b.lapD;
        check('small speaker: whole track keeps ≥ 0.7 dB more level on a laptop, < 150 Hz share down', lapUp(W) >= 0.7 && W.n.pLo < W.b.pLo,
          `laptop Δ ${f1(W.b.lapD)} → ${f1(W.n.lapD)} dB (${sgn(lapUp(W))}), phone Δ ${f1(W.b.phD)} → ${f1(W.n.phD)}, < 150 Hz ${W.b.pLo.toFixed(0)} → ${W.n.pLo.toFixed(0)} %`);
        check('small speaker: drops keep ≥ 0.7 dB more level on a laptop', lapUp(SSR['Drop']) >= 0.7 && lapUp(SSR['Final drop']) >= 0.7, sgn(lapUp(SSR['Drop'])) + ' / ' + sgn(lapUp(SSR['Final drop'])) + ' dB');
        const secs = BS.sections.map(s => SSR[s.name]);
        const dLo = Math.max(...secs.map(x => Math.abs(x.n.lo - x.b.lo))), dRms = Math.max(...secs.map(x => x.rn - x.rb)), dHi = W.n.hi - W.b.hi;
        check('small speaker: true sub kept (< 150 Hz level ±0.75 dB in every section)', dLo <= 0.75, '±' + f1(dLo) + ' dB max');
        // (> 900 Hz: two renders' random partials, clicks and grains differ by ~±1 dB)
        check('small speaker: not louder on full range (section RMS ≤ +0.5 dB), nothing new > 900 Hz (whole track ≤ +1 dB)', dRms <= 0.5 && dHi <= 1, 'RMS ' + sgn(dRms) + ' dB max, >900 Hz ' + sgn(dHi) + ' dB');
        // (round 3, the drum-kit score, measured on this page's model: a phone kept the drops at -17.2 / -16.0 dB re full range)
        const R3PH = { 'Drop': -17.2, 'Final drop': -16.0 };
        check('small speaker: on a phone the drops keep ≥ 0.5 dB more than round 3\'s score (the micro-foley sits where phones play)', SSR['Drop'].n.phD - R3PH['Drop'] >= 0.5 && SSR['Final drop'].n.phD - R3PH['Final drop'] >= 0.5,
          f1(SSR['Drop'].n.phD) + ' / ' + f1(SSR['Final drop'].n.phD) + ' dB (round 3 ' + R3PH['Drop'] + ' / ' + R3PH['Final drop'] + ')');
        check('small speaker: pre-glue peak rises ≤ 1 dB', preNow - preOld <= 1, sgn(preOld) + ' → ' + sgn(preNow) + ' dBFS');
      }

      /* 5. the typing vs the score's key parts: per-event peaks on the same bus (build.js voices its keystrokes with play.key) */
      {
        log('5 · TYPING vs SCORE (per-event peaks, dBFS, same scene bus; median [min … max])');
        const soloPeaks = async (roles, from, nbars, typing) => {
          const res = await render(nbars * BAR + 0.4, [[0.3, s => s.play(from)]], { solo: roles, typing: typing || null });
          const times = res.info.fired.filter(x => roles.includes(x.r)).map(x => x.when);
          return eventPeaks(res.buf, times);
        };
        const sHat = await soloPeaks(['hat'], T(21), 4), sSnare = (await soloPeaks(['snare'], T(21), 4)).filter(x => x > -26);
        const sPoly = await soloPeaks(['poly'], T(37), 4), sThock = await soloPeaks(['thock'], T(21), 4), sRim = await soloPeaks(['rim'], T(21), 4);
        // the film's keystrokes, as build.js voices them (foleyFire 'key': press 0.66 / space 0.7, vel 0.62–0.92, tone 0.3)
        const keys = await render(12.5, [[0.3, (s, E) => {
          const bus = E.bus('build');
          for (let i = 0; i < 40; i++) { const t = 0.5 + i * 0.25, kk = i % 6 === 5 ? 'space' : 'press'; E.play.key({ kind: kk, when: t, gain: kk === 'space' ? 0.7 : 0.66, vel: 0.62 + 0.3 * jit(t), tone: 0.3, pan: 0, dest: bus }); }
        }]], { noScore: true });
        const fk = eventPeaks(keys.buf, Array.from({ length: 40 }, (_, i) => 0.5 + i * 0.25));
        const row = (name, a) => log(`  ${pad(name, 46)} ${padL(f1(median(a)), 6)}  [${f1(Math.min(...a))} … ${f1(Math.max(...a))}]  n=${a.length}`);
        row('film keystrokes (build.js foley)', fk);
        row('score: key hats (bars 21–24)', sHat);
        row('score: space-bar snare (bars 21–24, backbeat)', sSnare);
        row('score: thock (the kick\'s key, bars 21–24)', sThock);
        row('score: relay rims (bars 21–24)', sRim);
        row('score: 3-against-4 Enter line (bars 37–40)', sPoly);
        const gHat = median(fk) - median(sHat), gSn = median(sSnare) - median(fk);
        log(`  → typing − score hats ${sgn(gHat)} dB; score snare − typing ${sgn(gSn)} dB; typing − Enter line ${sgn(median(fk) - median(sPoly))} dB`);
        check('the typing sits on top of the score\'s key hats (+2…+10 dB)', gHat >= 2 && gHat <= 10, sgn(gHat) + ' dB');
        check('the space-bar snare carries the backbeat over the typing (0…+10 dB)', gSn >= 0 && gSn <= 10, sgn(gSn) + ' dB');
        check('the Enter line sits under the typing (≥ +1 dB)', median(fk) - median(sPoly) >= 1, sgn(median(fk) - median(sPoly)) + ' dB');
        // typing windows thin the hats: keys on 12 of 16 steps in bars 21–24 → no hat within ½ 16th of a key (the gaps
        // between the typed phrases keep theirs); bars 25–26 (no keys) keep them all
        const kt = []; for (let b = 21; b <= 24; b++) for (let i = 0; i < 16; i++) if (i % 8 < 6) kt.push(T(b, i));
        const res = await render(6 * BAR + 0.4, [[0.3, s => s.play(T(21))]], { solo: ['hat'], typing: kt });
        const tf = res.info.fired.map(x => x.when - 0.31 + T(21));
        const inside = tf.filter(t => kt.some(k => Math.abs(k - t) < 0.5 * SD)).length, gaps = tf.filter(t => t < T(25) - 1e-3).length - inside, outside = tf.filter(t => t >= T(25) - 1e-3).length;
        log(`  typing windows (keys on 12 of 16 steps, bars 21–24): score hats on a typed 16th ${inside}, in the gaps between phrases ${gaps}, in bars 25–26 (no typing) ${outside}`);
        check('key hats step aside while a line types (score.typing)', inside === 0 && outside > 0, inside + ' on typed 16ths / ' + outside + ' in bars 25–26');
        log('');
      }

      /* 6a. the picture clock vs the heard sound */
      {
        const res = await render(3, [
          [0.2, (s, E, ctx, info) => { s.play(T(9)); info.p0 = ctx.currentTime; }],
          [1.5, (s, E, ctx, info) => info.pos.push([s.position(), s.heardPosition(), s.latency(), s.timeAt(s.position()), ctx.currentTime])]
        ], { latency: 0.2, parts: { drums: 0, low: 0, micro: 0, bed: 0, keys: 0, fx: 0 } });
        const p = res.info.pos[0];
        log(`6 · LATENCY  with a 200 ms output latency: position() ${p[0].toFixed(4)}  heardPosition() ${p[1].toFixed(4)} (Δ ${((p[0] - p[1]) * 1000).toFixed(1)} ms)  latency() ${p[2]}  timeAt(position()) − now ${((p[3] - p[4]) * 1000).toFixed(2)} ms`);
        check('heardPosition() = position() − output latency (±1 ms)', Math.abs(p[0] - p[1] - 0.2) <= 0.001, ((p[0] - p[1]) * 1000).toFixed(1) + ' ms');
        check('timeAt(position()) = now (±1 ms)', Math.abs(p[3] - p[4]) <= 0.001, ((p[3] - p[4]) * 1000).toFixed(2) + ' ms');
      }

      /* 6b. transport: play mid-bar, restart, idempotent play, stop (the fan stops with it) */
      {
        const P1 = T(20, 5) + 0.037;  // mid-bar, inside the riser
        const P2 = T(33, 9) + 0.051;  // mid-bar, breakdown
        const res = await render(9, [
          [0.1, (s, E, ctx, info) => { s.play(P1); info.p1 = ctx.currentTime; }],
          [1.1, (s, E, ctx, info) => info.pos.push(['a', s.position(), P1 + (ctx.currentTime - info.p1 - 0.01)])],
          [3.0, s => s.stop(0.3)],
          [3.6, (s, E, ctx, info) => info.pos.push(['stopped', s.playing])],
          [4.0, (s, E, ctx, info) => { s.play(P2); info.p2 = ctx.currentTime; }],
          [5.0, (s, E, ctx, info) => { info.pos.push(['b', s.position(), P2 + (ctx.currentTime - info.p2 - 0.01)]); s.play(s.position()); }], // idempotent
          [6.0, (s, E, ctx, info) => info.pos.push(['c', s.position(), P2 + (ctx.currentTime - info.p2 - 0.01)])],
          [7.0, s => s.stop(0.05)]
        ]);
        const b = res.buf, pa = res.info.pos.find(p => p[0] === 'a'), pb = res.info.pos.find(p => p[0] === 'b'), pc = res.info.pos.find(p => p[0] === 'c');
        const s1 = stats(b, 0.13, 1.0), sGap = stats(b, 3.4, 3.95), s2 = stats(b, 4.05, 6.9), sEnd = stats(b, 7.2, 9), all = stats(b);
        log(`  TRANSPORT  play(${P1.toFixed(3)}) mid-bar 20 → RMS ${f1(s1.rms)} in the first 0.9 s   position err ${((pa[1] - pa[2]) * 1000).toFixed(2)} ms`);
        log(`             stop(0.3) → RMS ${f1(sGap.rms)} 0.4–0.95 s later (bus reverb tail only)   playing=${res.info.pos.find(p => p[0] === 'stopped')[1]}`);
        log(`             play(${P2.toFixed(3)}) mid-bar 33 → RMS ${f1(s2.rms)}   position err ${((pb[1] - pb[2]) * 1000).toFixed(2)} ms;  play(position()) again at 5.0 s (idempotent) → err at 6.0 s ${((pc[1] - pc[2]) * 1000).toFixed(2)} ms`);
        log(`             stop(0.05) at 7.0 → RMS ${f1(sEnd.rms)} after 0.2 s   whole: peak ${f1(all.peak)}  clips ${all.clips}  NaN ${all.nans}`);
        check('mid-bar play() sounds at once (RMS > -44 in first 0.9 s)', s1.rms > -44, f1(s1.rms));
        check('mid-bar position() exact (≤ 2 ms)', Math.abs(pa[1] - pa[2]) <= 0.002 && Math.abs(pb[1] - pb[2]) <= 0.002, ((pa[1] - pa[2]) * 1000).toFixed(2) + ' / ' + ((pb[1] - pb[2]) * 1000).toFixed(2) + ' ms');
        check('play() idempotent (no restart, position continuous)', Math.abs(pc[1] - pc[2]) <= 0.002, ((pc[1] - pc[2]) * 1000).toFixed(2) + ' ms');
        check('stop() fades out, the fan included (RMS < -45 after the fade)', sGap.rms < -45 && sEnd.rms < -45, f1(sGap.rms) + ' / ' + f1(sEnd.rms));
        check('transport render: no NaN / clipping', all.nans === 0 && all.clips === 0, all.nans + ' / ' + all.clips);
        plot('Transport test: play mid-bar 20 · stop(0.3) at 3.0 s · play mid-bar 33 at 4.0 s · idempotent play at 5.0 s · stop at 7.0 s', b,
          [{ t: 0.1, label: 'play' }, { t: 3, label: 'stop' }, { t: 4, label: 'play' }, { t: 5, label: 'play again' }, { t: 7, label: 'stop' }]);
      }

      /* 6c. resuming inside the 2-bar riser (bars 19–20): the fx group (arm glide, servo whirs, noise swell) started at
             bar 19 vs re-entered 1.6 s in; and the fan (bed group, pads muted) resumed mid-drop vs uninterrupted */
      {
        const fxOnly = { drums: 0, low: 0, micro: 0, bed: 0, keys: 0, fx: 1 };
        const A1 = await render(3.2, [[0.1, s => s.play(T(19))]], { parts: fxOnly });
        const B1 = await render(1.6, [[0.1, s => s.play(T(19) + 1.6)]], { parts: fxOnly });
        const wA = [0.11 + 1.8, 0.11 + 2.8], wB = [0.11 + 0.2, 0.11 + 1.2];   // (film 1.8–2.8 s: a resumed arm glide re-accelerates over its first ~0.5 s)
        const sA = stats(A1.buf, ...wA), sB = stats(B1.buf, ...wB);
        const cA = centroid(spectrum(A1.buf, ...wA)), cB = centroid(spectrum(B1.buf, ...wB));
        const oct = Math.log2(cB / cA);
        log(`  RESUME inside the riser (fx group, film 1.8–2.8 s after bar 19):  uninterrupted RMS ${f1(sA.rms)} centroid ${cA.toFixed(0)} Hz  ·  re-entered 1.6 s in: RMS ${f1(sB.rms)} centroid ${cB.toFixed(0)} Hz  (Δ ${sgn(sB.rms - sA.rms)} dB, ${sgn(oct * 12)} semitones)`);
        check('mid-riser play() continues the glides and the sweep (centroid within ±4 semitones, level ±3 dB)', Math.abs(oct * 12) <= 4 && Math.abs(sB.rms - sA.rms) <= 3, sgn(oct * 12) + ' st / ' + sgn(sB.rms - sA.rms) + ' dB');
        const fanOnly = { solo: ['fan'] };
        const F1 = await render(4.2, [[0.1, s => s.play(T(21))]], fanOnly);
        const F2 = await render(2.2, [[0.1, s => s.play(T(21) + 2)]], fanOnly);
        const fa = stats(F1.buf, 0.11 + 2.6, 0.11 + 3.6), fb2 = stats(F2.buf, 0.11 + 0.6, 0.11 + 1.6);
        log(`  RESUME the fan (drop, film 2.6–3.6 s after bar 21): uninterrupted RMS ${f1(fa.rms)} · re-entered 2 s in: ${f1(fb2.rms)} (Δ ${sgn(fb2.rms - fa.rms)} dB)`);
        check('the fan resumes at its current speed (level ±2 dB) and is audible under the drop (> -50 dBFS)', Math.abs(fb2.rms - fa.rms) <= 2 && fa.rms > -50, sgn(fb2.rms - fa.rms) + ' dB, ' + f1(fa.rms) + ' dBFS');
        log('');
      }

      /* 6d. mix breakdown: each group soloed through the drop (bars 21–24, entered mid-track), with its share
             of the full mix above 4 and 8 kHz (sends follow their group, so the shares add up to ~100 %) */
      {
        log('  MIX (drop bars 21–24, each group soloed)   RMS    peak   >4k %  >8k %   share of mix >4k / >8k   octaves 63/125/250/500/1k/2k/4k/8k');
        const groups = ['drums', 'low', 'micro', 'bed', 'keys', 'fx'];
        const allR = await render(4 * BAR + 0.3, [[0, s => s.play(T(21))]]);
        const spM = spectrum(allR.buf, 0.02, 4 * BAR), m4 = bandE(spM, 4000, SR), m8 = bandE(spM, 8000, SR);
        let worst = 0, sum4 = 0, sum8 = 0;
        for (const g of groups) {
          const parts = { drums: 0, low: 0, micro: 0, bed: 0, keys: 0, fx: 0 }; parts[g] = 1;
          const res = await render(4 * BAR + 0.3, [[0, s => s.play(T(21))]], { parts });
          const s = stats(res.buf, 0.02, 4 * BAR), sp = spectrum(res.buf, 0.02, 4 * BAR), h = hfOf(sp), oc = octaves(sp);
          const sh4 = 100 * bandE(sp, 4000, SR) / m4, sh8 = 100 * bandE(sp, 8000, SR) / m8;
          sum4 += sh4; sum8 += sh8; worst = Math.max(worst, sh4, sh8);
          log(`    ${pad(g, 38)} ${padL(f1(s.rms), 6)} ${padL(f1(s.peak), 6)}  ${padL(h.p4.toFixed(1), 5)}  ${padL(h.p8.toFixed(1), 5)}   ${padL(sh4.toFixed(0), 5)} % / ${padL(sh8.toFixed(0), 4)} %        ${oc.slice(1, 9).map(x => f1(x)).join(' ')}`);
        }
        log(`    ${pad('sum of the solos', 38)}                               ${padL(sum4.toFixed(0), 5)} % / ${padL(sum8.toFixed(0), 4)} %`);
        const mute = await render(4 * BAR + 0.3, [[0, s => s.play(T(21))]], { parts: { drums: 0, low: 0, micro: 0, bed: 0, keys: 0, fx: 0 } });
        const ms = stats(mute.buf, 0.02, 4 * BAR);
        const dbs = x => (isFinite(x) ? f1(x) : '-inf');
        log(`    ${pad('every group muted (parts all 0)', 38)} ${padL(dbs(ms.rms), 6)} ${padL(dbs(ms.peak), 6)}   (the fan runs on the bed chain, the sends on copies of each chain)`);
        check('parts{} mutes a group with its sends and the fan (all groups muted → RMS < -80 dBFS)', ms.rms < -80, f1(ms.rms) + ' dBFS (solo share max ' + worst.toFixed(0) + ' %)');
        // small speakers: the low group (bass, subs) and the drums (kick body + the micro-foley) soloed, engine { body: 0 } → now
        const lapAbs = (b, a0, a1) => { const x = smallSpk(spectrum(b, a0, a1, 8192)); return { lap: x.full + x.lapD, ph: x.full + x.phD, x }; };
        const mixL = lapAbs(allR.buf, 0.02, 4 * BAR);
        log(`    small speaker (laptop / phone model levels, dBFS): full mix ${f1(mixL.lap)} / ${f1(mixL.ph)}`);
        for (const g of ['low', 'drums']) {
          const parts = { drums: 0, low: 0, micro: 0, bed: 0, keys: 0, fx: 0 }; parts[g] = 1;
          const r0 = await render(4 * BAR + 0.3, [[0, s => s.play(T(21))]], { parts, engine: { body: 0 } });
          const r1 = await render(4 * BAR + 0.3, [[0, s => s.play(T(21))]], { parts });
          const a = lapAbs(r0.buf, 0.02, 4 * BAR), b = lapAbs(r1.buf, 0.02, 4 * BAR);
          log(`      ${pad(g + ' soloed', 34)} laptop ${f1(a.lap)} → ${f1(b.lap)} (${sgn(b.lap - a.lap)} dB, re the mix ${sgn(a.lap - mixL.lap)} → ${sgn(b.lap - mixL.lap)})   phone ${f1(a.ph)} → ${f1(b.ph)} (${sgn(b.ph - a.ph)})   full range ${f1(a.x.full)} → ${f1(b.x.full)}   < 150 Hz ${f1(a.x.lo)} → ${f1(b.x.lo)} dBFS`);
          if (g === 'low') check('small speaker: the low group (bass, subs) +2 dB or more on a laptop and +6 dB on a phone, < 150 Hz kept (±0.5 dB)', b.lap - a.lap >= 2 && b.ph - a.ph >= 6 && Math.abs(b.x.lo - a.x.lo) <= 0.5,
            `${sgn(b.lap - a.lap)} dB laptop, ${sgn(b.ph - a.ph)} dB phone, < 150 Hz ${sgn(b.x.lo - a.x.lo)} dB`);
          else check('small speaker: the drums (micro-foley + kick) sit within 8 dB of the mix on a phone', b.ph - mixL.ph >= -8, `${sgn(b.ph - mixL.ph)} dB re the mix on a phone (laptop ${sgn(b.lap - mixL.lap)})`);
        }
      }
    } else log('(?only=quick: sections 3–6 skipped)');

    log('');
    log('CHECKS');
    checks.forEach(c => log(`  ${c.ok ? 'PASS' : 'FAIL'}  ${c.name.length > 110 ? c.name + '  ' : pad(c.name, 112)}${c.detail}`));
    log(`  ${checks.filter(c => c.ok).length}/${checks.length} passed`);
  } catch (e) {
    log('ERROR ' + (e && e.stack || e));
  }
  log('');
  log('errors: ' + (window.__errors.length ? window.__errors.join(' | ') : 'none'));
  document.getElementById('report').textContent = out.join('\n');
  window.__done = true;
})();
</script>
</body>
</html>
